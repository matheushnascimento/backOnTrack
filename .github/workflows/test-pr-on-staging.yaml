name: Test PR on Staging

# TODO PR publica na branch `staging`, que é o que o BoT staging consome. Serve
# pra validar no aparelho ANTES do merge.
#
# ## Por que sem label
#
# O #269 exigia a label `staging` no PR. Como a regra virou "toda feature
# branch vai pro staging", a label passaria a estar em todo PR, e uma marca
# que está em tudo não marca nada. Pior: dava a impressão de escolher qual PR
# está carregado, o que ela nunca fez. Existe UM canal `staging` e UM app no
# aparelho, então é sempre um PR por vez: **o staging mostra o push mais
# recente**, seja de qual PR for. Automatizar a label só tornaria a colisão
# silenciosa. Melhor tirar a cerimônia e deixar a regra explícita aqui.
#
# ## Quem NÃO publica
#
# - **Draft**: trabalho em andamento não precisa ocupar a bancada.
# - **Label `skip-staging`**: escape hatch manual.
# - **PR de fork**: não recebe `EXPO_TOKEN`, falharia com erro confuso.
# - **Mudança só de doc ou de workflow**, pelo filtro `paths` abaixo. Não
#   altera o bundle, e publicar seria gasto de update à toa.
#
#   **Com uma exceção, e ela existe porque a regra acima já foi falsa.** O
#   `docs/04-roadmap-milestones.md` É código: o `babel-plugin-inline-import`
#   (ver `babel.config.js`) compila o markdown pra dentro do bundle como
#   string literal, e `app/roadmap.jsx` o importa. Editar esse arquivo muda o
#   app. Enquanto ele estava no filtro, duas mudanças reais de tela pularam a
#   bancada **em silêncio**, sem falha e sem aviso, e foi preciso disparar o
#   `workflow_dispatch` na mão nos dois casos (#300 e #307). Ver #301.
#
#   Se algum dia outro doc virar import, ele entra na lista de exceção junto.
#   Hoje é o único: `grep -rn 'from \".*\.md\"' app/ components/ constants/`.
#
# ## O que garante que isto não vaze pros testers
#
# A promoção (`promote-update.yaml`) NÃO sai de `staging`. Sai de `release`,
# que só a main alimenta. Código não-mergeado não tem caminho até o canal
# `preview`. Ver docs/10-canais-e-promocao.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # `paths` com negação em vez de `paths-ignore`, porque `paths-ignore` não
    # sabe re-incluir. A ordem decide: cada padrão reavalia o caminho, e o
    # último que casa manda. Por isso a exceção do roadmap vem por último, e
    # precisa vencer DOIS padrões (`docs/**` e `**/*.md`).
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "!.github/**"
      - "docs/04-roadmap-milestones.md"
  workflow_dispatch:
    inputs:
      pr:
        description: "Número do PR a carregar no BoT staging (força, ignora os filtros)"
        required: true

jobs:
  publish:
    name: PR -> branch staging
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       !contains(github.event.pull_request.labels.*.name, 'skip-staging'))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve o PR alvo
        id: pr
        env:
          NUM: ${{ github.event_name == 'workflow_dispatch' && inputs.pr || github.event.pull_request.number }}
        run: echo "num=$NUM" >> "$GITHUB_OUTPUT"

      # `refs/pull/N/merge` é o PR JÁ MESCLADO com a main, que é o que a main vai
      # virar depois do merge. Testar o head puro esconderia conflito
      # semântico com o que entrou na main enquanto o PR estava aberto.
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ steps.pr.outputs.num }}/merge

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/jod"

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publica o PR em staging
        env:
          NUM: ${{ steps.pr.outputs.num }}
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          MSG="PR #${NUM}${TITULO:+: $TITULO}"
          eas update --branch staging --environment preview \
            --message "$MSG" --non-interactive

      - name: Resumo
        env:
          NUM: ${{ steps.pr.outputs.num }}
        run: |
          {
            echo "## BoT staging agora roda o PR #${NUM}"
            echo ""
            echo "Abra o **BoT staging** no aparelho pra validar (pode precisar fechar e reabrir)."
            echo ""
            echo "Se você tinha outro PR carregado, ele foi substituído: a bancada é um slot só, sempre com o push mais recente."
            echo ""
            echo "Isto **não** chega nos testers: a promoção sai da branch \`release\`, que só a main alimenta."
          } >> "$GITHUB_STEP_SUMMARY"
