# Customização do bmad-build pro backOnTrack. Mescla com o customize.toml da
# skill (strings substituem, listas somam). Ver docs/13-fluxo-bmad.md.
#
# As regras do projeto vivem no AGENTS.md, que o Build lê como fonte das
# lentes de revisão e o Claude Code carrega pelo CLAUDE.md. Não repetir aqui.

[workflow]

# O Build termina no commit local. Push, PR, validação no aparelho e merge
# seguem pelas skills do projeto, cada uma com o OK do usuário.
on_complete = """
Não faça push nem abra PR. Reporte o que mudou e pare. O próximo passo é a
skill `safe-push` (push + PR em português), depois parar até o usuário validar
no BoT Staging, e só então `pr-merge` e `feature-finish`, com OK explícito.
"""
