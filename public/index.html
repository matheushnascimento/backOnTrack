<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover deixa o app ocupar a tela toda no iPhone instalado;
         as margens do entalhe vêm do SafeAreaView, pelas env(safe-area-inset-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>Back on Track</title>

    <!-- PWA (#408). O manifesto serve ao Android e ao desktop; o iPhone lê
         as meta tags da Apple e o apple-touch-icon.
         `use-credentials`: o navegador busca o manifesto SEM cookies por
         padrão, e o preview da Vercel exige o cookie de login. Sem isso o
         preview responde com redirecionamento e o Chrome diz que o app não
         pode ser instalado. No endereço público não muda nada. -->
    <link
      rel="manifest"
      href="/manifest.webmanifest"
      crossorigin="use-credentials"
    />
    <meta name="theme-color" content="#2E5A88" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Back on Track" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Back on Track precisa de JavaScript pra funcionar.</noscript>
    <div id="root"></div>
    <!-- Service worker só em https: o servidor de desenvolvimento roda em
         http na rede local, e ali ele só atrapalharia guardando bundle velho. -->
    <script>
      if ("serviceWorker" in navigator && location.protocol === "https:") {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js");
        });
      }
    </script>
  </body>
</html>
