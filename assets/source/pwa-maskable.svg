<!--
  Back on Track · ícone "maskable" do PWA (#408).
  O mesmo desenho do icon.svg, encolhido pra 76% em volta do centro: o
  Android recorta o ícone instalado em círculo ou squircle, e só os 80%
  centrais são garantidos. No icon.svg o ponto verde encosta na borda e
  seria cortado.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect width="1024" height="1024" fill="#2E5A88"/>
  <g transform="translate(512 512) scale(0.76) translate(-512 -512)">
    <path d="M 220 740 Q 460 740 560 540 T 820 300"
          fill="none" stroke="#F8F9FA" stroke-width="72" stroke-linecap="round"/>
    <circle cx="220" cy="740" r="60" fill="#4CAF50"/>
  </g>
</svg>
