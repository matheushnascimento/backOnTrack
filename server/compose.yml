# Deploy do server WS. TLS público via Cloudflare Tunnel — mas o cloudflared já
# roda como serviço systemd no host (servindo outros subdomínios do túnel `home
# server`), então NÃO subimos um container cloudflared aqui: seria uma segunda
# replica redundante do mesmo túnel.
#
# Fluxo:
#   1. Container `sync` expõe 8787 em 127.0.0.1 (loopback do host, não LAN).
#   2. cloudflared do systemd alcança via `http://127.0.0.1:8787`.
#   3. Rota `backontrack-sync.mhdn.com.br` configurada no dashboard do túnel:
#        Public Hostname: backontrack-sync . mhdn.com.br
#        Service:         HTTP  (não HTTPS)
#        URL:             http://127.0.0.1:8787
#      Nova rota é puxada automaticamente pelo cloudflared existente — sem
#      restart, sem rebuild.
#
# Subir:
#   docker compose up -d --build
#   docker compose logs -f
services:
  sync:
    build: .
    container_name: backontrack-sync
    restart: unless-stopped
    environment:
      PORT: "8787"
      DATA_DIR: "/data"
    volumes:
      - ./data:/data
    # Bind explícito em 127.0.0.1: acessível pelo cloudflared do host, mas não
    # publicado na LAN nem no público. Superfície de ataque mínima.
    ports:
      - "127.0.0.1:8787:8787"
